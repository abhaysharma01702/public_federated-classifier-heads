[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedheads"
version = "0.1.0"
description = "Classifier heads in federated sentiment analysis: accuracy against communication cost"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scikit-learn",
    "torch",
    "transformers",
    "peft",
]

[tool.setuptools.packages.find]
where = ["src"]
